<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#172554" />
    <title>Webinar registration · Nexora</title>
    <style>
      :root{font-family:Inter,"DM Sans",Arial,sans-serif;color:#252733;background:#f7f8fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:48px auto;padding:0 22px}.brand{font-weight:750;font-size:20px;color:#6255cc;margin-bottom:24px}.event{display:grid;grid-template-columns:1.3fr .8fr;background:#fff;border:1px solid #e5e7ee;border-radius:14px;overflow:hidden}.copy{padding:clamp(28px,6vw,72px)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#6255cc}.copy h1{font-size:clamp(32px,5vw,52px);line-height:1.08;letter-spacing:-1.5px;margin:17px 0}.description{line-height:1.7;color:#737684;white-space:pre-wrap}.meta{display:grid;gap:10px;margin-top:28px;color:#555866;font-size:13px}.form{background:#fafaff;border-left:1px solid #ececf2;padding:clamp(24px,4vw,42px)}h2{font-size:18px;margin:0 0 8px}.form p{font-size:12px;color:#838593;line-height:1.55;margin:0 0 22px}label{display:block;font-size:11px;color:#656775;margin:15px 0}input{display:block;width:100%;border:1px solid #dfe1e8;border-radius:6px;padding:11px;margin-top:6px;font:inherit}label.consent{display:flex;align-items:flex-start;gap:9px;line-height:1.45}label.consent input{width:auto;margin:2px 0 0}button{border:0;border-radius:6px;background:#6255cc;color:white;padding:12px 16px;font:600 12px inherit;width:100%;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.notice{font-size:12px;color:#737684;line-height:1.5;margin-top:14px}.notice.error{color:#b33d36}.success{padding:22px;background:#eef8f2;border:1px solid #cfe9d9;border-radius:8px;color:#2f7655;line-height:1.6}@media(max-width:720px){.shell{margin:22px auto}.event{grid-template-columns:1fr}.form{border-left:0;border-top:1px solid #ececf2}}
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="brand">nexora.</div>
      <div id="event-root" class="event" aria-live="polite"><section class="copy"><span class="eyebrow">Online event</span><h1>Loading event…</h1></section></div>
    </main>
    <script src="/event.js" defer></script>
  </body>
</html>
